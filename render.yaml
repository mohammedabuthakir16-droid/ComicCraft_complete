services:
  - type: web
    name: comiccraft-ai-studio
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn run:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DEBUG
        value: "false"
      - key: HOST
        value: "0.0.0.0"
      - key: GEMINI_API_KEY
        sync: false
